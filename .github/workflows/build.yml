name: Android CI & Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-audit-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Scan tracked files for exposed credentials
      shell: bash
      run: |
        set -euo pipefail
        echo "=== Scanning tracked files for common API keys and credentials ==="
        # Scan the current checkout, not GitHub Actions secrets or generated build output.
        # The patterns target recognizable live-token formats to avoid matching ordinary API names.
        if git grep -n -I -E \
          'AIza[0-9A-Za-z_-]{30,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|xox[baprs]-[A-Za-z0-9-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
          -- . ':!*.lock' ':!*.md' ':!.env.example' ':!app/build/**'; then
          echo "::error::Possible hard-coded credential detected. Remove it from tracked files and rotate/revoke it if it was real."
          exit 1
        fi

        EXPOSED_FILES=$(find . -type f \( -name "*.keystore" -o -name "*.jks" -o -name "*.p12" -o -name ".env" \) -not -path "./.git/*" -print)
        if [ -n "$EXPOSED_FILES" ]; then
          echo "::error::Credential/keystore files found in the checkout:"
          echo "$EXPOSED_FILES"
          exit 1
        fi
        echo "Credential scan passed."

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'
        validate-wrappers: false

    - name: Generate Ephemeral Debug Keystore (CI Runtime Only)
      run: |
        keytool -genkey -v -keystore debug.keystore \
          -storepass android -alias androiddebugkey -keypass android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Run Unit Tests
      run: gradle :app:testDebugUnitTest --no-daemon --no-configuration-cache

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --no-configuration-cache

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
